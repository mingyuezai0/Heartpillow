map $arg_u $img_ok {
    default 0;
    "~*^https?://([^/]*\.)?qpic\.cn/" 1;
    "~*^https?://([^/]*\.)?gtimg\.cn/" 1;
    "~*^https?://([^/]*\.)?hdslb\.com/" 1;
    "~*^https?://([^/]*\.)?biliimg\.com/" 1;
}

server {
    listen 7863 default_server;
    server_name _;
    root /opt/xinzhen;
    index index.html;
    charset utf-8;

    # 心枕本体（单文件应用）
    location / {
        try_files $uri /index.html;
    }

    # 同源反代模型网关（wb2api 之类）：浏览器里就不会有跨域问题
    location /v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            return 204;
        }
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        proxy_pass http://127.0.0.1:8888/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # NapCat WebUI（扫码登录 / 看状态）
    location /webui/ {
        proxy_pass http://127.0.0.1:6099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:6099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # B 站代跑（浏览器发不出 B 站请求，由常驻客户端去取）
    location /bili/ {
        proxy_pass http://127.0.0.1:9100/bili/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 常驻客户端（代替页面）：页面关着也在收消息
    location /qq/bridge/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            return 204;
        }
        proxy_pass http://127.0.0.1:9100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin * always;
    }

    # NapCat（OneBot 11）：给网页版用，同源
    location /qq/api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            return 204;
        }
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3000;
        proxy_read_timeout 300s;
    }
    location /qq/ws {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 图片代取（QQ 头像 / 表情 / B 站图），避免浏览器混内容
    location /qq/img/ {
        proxy_pass http://127.0.0.1:9099/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 30s;
        expires 10m;
    }
    location = /qq/diag {
        proxy_pass http://127.0.0.1:9099/diag;
        proxy_set_header Host 127.0.0.1;
    }
}
